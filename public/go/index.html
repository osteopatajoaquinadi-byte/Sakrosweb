<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C9402A">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sakros Go">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/go/manifest.webmanifest">
<link rel="apple-touch-icon" href="/go/apple-touch-icon.png">
<title>Sakros Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: app de una columna para el móvil; cabecera fija con pestañas y una tira de semanas tipo calles de pista */
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --sunk:#E6EAEE; --ink:#15202B; --muted:#5A6672; --line:#D5DBE2;
  --accent:#C9402A; --accent-soft:#F8E3DE; --on-accent:#FFFFFF; --ok:#25734A; --ok-soft:#DDF0E5; --deload:#2F6F9F; --deload-soft:#DDEAF4; --warn:#B7791F;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --sunk:#1E2933; --ink:#E6EBF0; --muted:#9AA7B4; --line:#2A3642;
  --accent:#EE6446; --accent-soft:#3A2019; --on-accent:#1A0B07; --ok:#58C48A; --ok-soft:#173326; --deload:#6FB0E0; --deload-soft:#162B3B; --warn:#E0A84A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --sunk:#1E2933; --ink:#E6EBF0; --muted:#9AA7B4; --line:#2A3642;
  --accent:#EE6446; --accent-soft:#3A2019; --on-accent:#1A0B07; --ok:#58C48A; --ok-soft:#173326; --deload:#6FB0E0; --deload-soft:#162B3B; --warn:#E0A84A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
h1{font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:.01em;margin:0;line-height:1}
h1 span{color:var(--accent)}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{height:46px;width:auto;display:block}
.brand .logo-on-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .logo-on-light{display:none}:root:not([data-theme="light"]) .brand .logo-on-dark{display:block}}
:root[data-theme="dark"] .brand .logo-on-light{display:none}
:root[data-theme="dark"] .brand .logo-on-dark{display:block}
.sub{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:4px}
.tab{flex:1;min-width:0;font:600 .9rem var(--body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 4px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.lanes{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.lane{flex:1 0 54px;min-width:54px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 4px 5px;text-align:center;cursor:pointer;color:var(--ink);font:inherit;position:relative}
.lane b{display:block;font-family:var(--display);font-size:1.35rem;line-height:1}
.lane small{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lane::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:2px;background:var(--accent)}
.lane.descarga::after{background:var(--deload)}
.lane.lock{opacity:.45;cursor:default}.lane.lock::after{display:none}
.cell.lock{cursor:default;opacity:.5;font-size:.65rem}
.quien h2{margin-bottom:6px}.quienline{margin:-4px 0 10px}
.popfondo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.popcard{max-width:480px;width:100%;margin:0}
@media(min-width:600px){.popfondo{align-items:center}}
tr.grp th{text-align:left;padding-top:12px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.locknote{margin:6px 0 0}
.lane .pct{position:absolute;top:3px;right:5px;font-size:.6rem;color:var(--ok);font-weight:700}
.lane[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lane[aria-pressed="true"] small{color:var(--surface);opacity:.75}
.days{display:flex;gap:8px;padding-bottom:10px}
.day{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font:inherit}
.day b{font-family:var(--display);font-size:1.1rem;display:block;line-height:1.1}
.day span{font-size:.78rem;color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
main{padding-block:16px 48px;display:grid;gap:14px}
.note{font-size:.85rem;color:var(--muted)}
.banner{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:10px 12px;font-size:.88rem}
.sess{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sess h2{font-family:var(--display);font-size:1.4rem;margin:0;line-height:1.1;text-wrap:balance}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.descarga{background:var(--deload-soft);color:var(--deload)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label.f{display:grid;gap:3px;font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase;flex:1 1 90px;min-width:0}
input,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
textarea{resize:vertical;min-height:40px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr)}
.ex.done{border-color:var(--ok)}
.media{position:relative;background:#fff;aspect-ratio:3/2;max-width:100%;cursor:pointer;border:0;padding:0;display:block;width:100%}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media.tall{aspect-ratio:4/5;background:#0d1217}
.media.tall img{object-fit:contain}
.media .tag{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);text-align:left;background:rgba(10,16,22,.72);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:999px}
.media .dots{position:absolute;right:8px;top:10px;display:flex;gap:4px}
.media .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
.media .dots i.on{background:#fff}
.body{padding:12px 14px 14px;display:grid;gap:10px;min-width:0}
.head{display:flex;gap:10px;align-items:flex-start}
.blk{font-family:var(--display);font-weight:700;font-size:1rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:1.5;flex:none}
.head h3{margin:0;font-family:var(--display);font-size:1.3rem;line-height:1.1;flex:1;min-width:0;text-wrap:balance}
.pres{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.05}
.pres .rpe{font-family:var(--body);font-size:.85rem;font-weight:600;color:var(--muted);margin-left:6px}
.adj{font-size:.82rem;background:var(--accent-soft);border-radius:8px;padding:6px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px 7px 8px;font:600 .95rem var(--body);cursor:pointer}
.check .box{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:.9rem;color:transparent}
.check[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.check[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--accent)}
ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.clave{margin:8px 0 0;font-size:.9rem;background:var(--sunk);border-radius:8px;padding:8px 10px}
.btn{font:600 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:default}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td input{min-width:80px;padding:6px 8px}
.grid8{display:grid;grid-template-columns:auto repeat(8,minmax(34px,1fr));gap:4px;align-items:center;font-size:.85rem}
.cell{height:30px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;border:0;font-family:inherit}
.cell.part{background:var(--accent-soft);color:var(--accent)}
.cell.full{background:var(--ok);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.card h2{font-family:var(--display);font-size:1.35rem;margin:0}
.chat{display:grid;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;white-space:normal;overflow-wrap:anywhere}
.msg.u{justify-self:end;background:var(--ink);color:var(--surface);border-bottom-right-radius:4px}
.msg.a{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0 6px;padding-left:18px}
.msg .tool{font-size:.8rem;color:var(--muted);font-style:italic}
.composer{position:sticky;bottom:0;background:var(--bg);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick .btn{font-size:.8rem;padding:5px 10px}
.send{display:flex;gap:8px;align-items:end}
.send textarea{flex:1}
.credit{font-size:.75rem;color:var(--muted);text-align:center}
.dx{display:grid;gap:6px}
.dxi{display:grid;gap:2px;font-size:.88rem;border-left:4px solid var(--ok);background:var(--sunk);border-radius:6px;padding:6px 10px}
.dxi.adaptar{border-left-color:var(--warn)}
.dxi.sustituir{border-left-color:var(--accent)}
.dxl{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.auto{font-size:.85rem;background:var(--deload-soft);border-radius:8px;padding:6px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (min-width:640px){.ex.nomedia{grid-template-columns:minmax(0,1fr)}}
.medir{margin:0;padding-left:20px;display:grid;gap:6px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px}
.wholbl{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f select{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.who select{font:600 1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;max-width:48vw}
.whoinfo{font-size:.8rem;color:var(--muted)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.cargas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.err{color:var(--accent);margin:0}
.iso input{min-width:64px;width:64px;padding:6px}
.iso th,.iso td{padding:6px}
.balrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-block:6px}
.sem{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px}
.sem.v{background:var(--ok-soft);color:var(--ok)}.sem.a{background:var(--deload-soft);color:var(--warn)}.sem.r{background:var(--accent-soft);color:var(--accent)}.sem.n{background:var(--sunk);color:var(--muted)}
details.card>summary{font-weight:700}
.freq{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:8px}
.vid video{width:100%;max-height:70vh;border-radius:8px;margin-top:8px;background:#000;display:block}
.dxline{margin:0;font-size:.88rem;background:var(--sunk);border-radius:8px;padding:8px 10px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.dxhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dxcard.on{border-color:var(--accent)}
.dxcard ul{margin:0;padding-left:20px;display:grid;gap:4px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .82rem var(--body);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* vista cliente */
.tcrow{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.tcrow input{width:22px;height:22px;flex:none;margin-top:2px}
.precio{margin:0;font-size:1.05rem}.precio b{font-family:var(--display);font-size:2rem}
.onb{gap:14px}
.onbhead{display:grid;gap:6px;justify-items:start}
.brandline{margin:0;font-weight:600}
.bigopt{display:grid;gap:2px;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--r);padding:12px 14px;cursor:pointer;font:inherit}
.bigopt b{font-family:var(--display);font-size:1.25rem;line-height:1.15}
.bigopt span{font-size:.88rem;color:var(--muted)}
.bigopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.btn.big{font-size:1.05rem;padding:12px 20px;border-radius:10px}
.btn.grow{flex:1}
.plancard{border-left:4px solid var(--accent);background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.plancard h2,.plancard p{margin:0}
.hero{gap:8px}
.hero h2{font-size:1.7rem}
.hoytit{margin:0;font-weight:600}
.meta{margin:0;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.playtop{display:flex;gap:10px;align-items:center;justify-content:space-between}
.clock{font-family:var(--display);font-size:1.2rem;font-weight:700}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--sunk)}
.steps i.ok{background:var(--ok)}.steps i.on{background:var(--accent)}
.playcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.media.play{aspect-ratio:4/3}
.media.play.tall{aspect-ratio:4/5}
.media.vidm{cursor:pointer}
.chkq{flex-wrap:wrap}.chkq .note,.chkq .wholbl{flex-basis:100%}
.cargab{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:150px;margin:8px 0}
.cargab .cb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.cargab .cb i{display:block;width:70%;background:var(--accent);border-radius:4px 4px 0 0}.cargab .cb.desc i{background:var(--deload)}
.cargab .v{font-size:.7rem;color:var(--muted)}.cargab .pct{font-size:.72rem;font-weight:700}
.tec{margin-top:6px}.tec summary{cursor:pointer;color:var(--accent);font-weight:600}.tec p{margin:6px 0;font-size:.92rem}
.ssmedia{display:grid;grid-template-columns:1fr 1fr;gap:2px}.ssmedia .media{aspect-ratio:4/5}
.ex.ss .sub{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.ex.ss .sub h4{margin:0;font-size:1rem}
.sslinea{font-size:1.05rem;line-height:1.35}
.resum{margin:6px 0 2px;font-size:.92rem;line-height:1.4;color:var(--ink)}.resum strong{color:var(--accent)}
.blqh{display:flex;align-items:center;gap:8px;margin:18px 0 6px;font-family:var(--display);font-size:1.25rem;text-transform:uppercase;letter-spacing:.02em}
.blqh .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:1rem}
.blqh .note{font-family:var(--body);text-transform:none;font-size:.85rem;letter-spacing:0}.media video{width:100%;height:100%;object-fit:contain;display:block;background:#0d1217}
.playname{font-family:var(--display);font-size:1.6rem;margin:0;line-height:1.1}
.pres.big{font-size:2rem}
.rest{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.rest.run{border-color:var(--deload)}
.rest.go{border-color:var(--ok)}
.resttxt{font-family:var(--display);font-size:1.5rem;font-weight:700}
.restbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.restbar i{display:block;height:100%;background:var(--deload)}
.playnav{display:flex;gap:8px;align-items:stretch;position:sticky;bottom:0;background:var(--bg);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
.hello{font-family:var(--display);font-size:1.3rem;font-weight:700}
@media (min-width:640px){
  .ex{grid-template-columns:240px minmax(0,1fr)}
  .media{aspect-ratio:auto;height:100%;min-height:200px}
  .media.tall{aspect-ratio:3/4;height:auto;align-self:start}
}
@media (prefers-reduced-motion:no-preference){.check,.lane,.cell{transition:background .15s,border-color .15s}}
.fmsstrip{display:flex;gap:4px;overflow-x:auto;margin:8px 0}.fmsstrip img,.fmsstrip .ph{width:64px;height:84px;object-fit:cover;border-radius:6px;background:var(--sunk);flex:0 0 auto}
.fmslado{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.fmslado h3{margin:0 0 6px;font-size:1rem}
.fmsclear{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
details.card.fms{grid-template-columns:minmax(0,1fr)}.fmslado{min-width:0}
details.card.fms>summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2.sec{margin:18px 4px 8px;font-size:1.1rem}p.big{font-family:var(--display);font-size:2rem;margin:4px 0}
</style>
</head>
<body>

 puenteexp:{n:'Puentes explosivos',video:'puente',img:[['sakpuentex-1','Suelo: barra sobre la cadera, rodillas flexionadas'],['sakpuentex-2','Suelo: extensión explosiva, la barra sale hacia arriba'],['sakbisagra-2','De pie: barra en la cadera'],['sakbisagra-3','De pie: bisagra hasta pasar las rodillas'],['sakbisagra-1','De pie: extensión de cadera explosiva']],pasos:[

  'Cada repetición, a la máxima velocidad de subida; la bajada, controlada.'],
  clave:'Es potencia de cadera: si la velocidad baja, termina la serie. En la bisagra de pie, usa una carga que te deje subir rápido (RPE 6–7).'},
 bulgara:{n:'Sentadilla búlgara + Nordic',img:[['bulgara-0','Búlgara: arriba, pie trasero en el banco'],['bulgara-1','Búlgara: rodilla trasera cerca del suelo'],['nordic-0','Nordic: rodillas fijas, cuerpo recto'],['nordic-1','Nordic: bajada lenta hasta las manos']],pasos:[

  clave:'Si el Nordic es demasiado, usa una banda atada al pecho. Si vas justo de tiempo, este es el bloque que se quita.'},
 intervalos:{n:'Intervalos al 90–95 % FC máx',img:[['remo-0','Remo: recogida'],['remo-1','Remo: empuje de piernas'],['cinta-1','Cinta inclinada']],pasos:[

 regen:{n:'Regeneración',img:[['flexor-0','Flexor de cadera: rodilla en el suelo']],pasos:[

 salidas:{n:'Salidas desde 3 apoyos',img:[['salida-0','Posición de 3 apoyos'],['salida-1','Salida: empuje y braceo'],['pared-1','Inclinación de la aceleración']],pasos:[

 pushpress:{n:'Push press',img:[['pushpress-1','Impulso: flexión corta de rodillas'],['pushpress-0','Empuje hasta bloquear arriba']],pasos:[

  'Baja la barra a los hombros amortiguando con las rodillas.']},
 skater:{n:'Skater / caída lateral',img:[['skater-0','Skater: impulso lateral'],['skater-1','Skater: caída estable'],['caida-0','Caída lateral: sobre una pierna junto al cono'],['caida-1','Caída lateral: aterriza y frena 2 s']],pasos:[

 frontal:{n:'Sentadilla frontal',video:'sent-frontal',img:[['sakfrontal-3','Barra apoyada en los hombros, brazos al frente'],['sakfrontal-1','Inicio (perfil): codos altos'],['sakfrontal-2','Abajo (perfil): tronco vertical'],['sakfrontal-4','Abajo, de cerca: codos altos y barra pegada al cuello']],pasos:[

 dominadas:{n:'Dominadas',img:[['dominadas-0','Colgado, escápulas activas'],['dominadas-1','Barbilla sobre la barra']],pasos:[

 muerto:{n:'Peso muerto',img:[['sakmuerto-1','Inicio (perfil): cadera atrás, espalda neutra'],['sakmuerto-2','Inicio (frente): agarre por fuera de las piernas'],['muerto-1','Bloqueo: cadera y rodillas a la vez']],pasos:[

 t3030:{n:'30/30',img:[['cinta-0','Corriendo: 30 s fuertes'],['remo-1','Remo: misma potencia en cada repetición']],pasos:[

  const n=k=>{const x=parseFloat(String(T['x_'+k+'_0']??'').replace(',','.'));return isNaN(x)?null:x};
  const c=[];const si=n('silla'),eq=n('equi'),s1=n('sent1');

}

function limpiaFase(s){// técnica limpia en las 2 semanas anteriores

function fmsPrioridad(zona){return FMSH.filter(id=>ZTEST[zona].includes(id)).map(id=>({id,...fmsRes(id)})).filter(r=>r.score!=null&&r.score>0&&(r.score<3||r.asym))}

function b64De(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob)})}
async function framesDe(file,n=10,maxW=640){
  const url=URL.createObjectURL(file),v=document.createElement('video');
  v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';v.src=url;
  try{
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error('formato'));setTimeout(()=>rej(new Error('tiempo')),20000)});
    try{await v.play();v.pause()}catch(e){}
    const dur=v.duration;if(!isFinite(dur)||dur<=0)throw new Error('formato');if(dur>90)throw new Error('largo');
    const w=Math.min(maxW,v.videoWidth||maxW),hh=Math.round(w*(v.videoHeight||maxW)/(v.videoWidth||maxW));
    const c=document.createElement('canvas');c.width=w;c.height=hh;const g=c.getContext('2d');const out=[];
    for(let i=0;i<n;i++){
      const t=Math.min(dur-0.05,dur*(0.04+0.92*i/(n-1)));
      await new Promise(res=>{const done=()=>{v.removeEventListener('seeked',done);res()};v.addEventListener('seeked',done);v.currentTime=t;setTimeout(done,4000)});
      g.drawImage(v,0,0,w,hh);
      out.push(await new Promise(res=>c.toBlob(res,'image/jpeg',0.72)));
    }
    return out;
  }finally{URL.revokeObjectURL(url)}
}
async function subirVideo(id,l,file){

  try{

    FMSMEM[k]=await Promise.all(blobs.map(b64De));
    let paths=[];
    if(SB){
      FMSBUSY[k]='Subiendo…';render();
      const ts=Date.now(),base=UI.atleta+'/'+id+'-'+l+'-'+ts;
      for(let i=0;i<blobs.length;i++){const p=base+'-'+i+'.jpg';const{error}=await SB.storage.from('go-fms').upload(p,blobs[i],{contentType:'image/jpeg',upsert:true});if(error)throw new Error('subida');paths.push(p);FMSURL[p]=URL.createObjectURL(blobs[i])}
    }else{paths=blobs.map((b,i)=>{const p='local/'+k+'-'+i;FMSURL[p]=URL.createObjectURL(b);return p})}
    await patchR(id,r=>{r.frames={...(r.frames||{}),[l]:paths};const ia=r.ia;if(ia&&ia.lados){r.ia={...ia,lados:{...ia.lados}};delete r.ia.lados[l]}});
    delete FMSBUSY[k];
    const t=fmsT(id),r=(FF().r||{})[id]||{};
    if(t.lados.every(x=>(r.dolor||{})[x]==='si'||((r.frames||{})[x]||[]).length))await analizarFms(id);else render();

    FMSBUSY[k]=null;delete FMSBUSY[k];
    const msg=e.message==='largo'?'El video dura más de 90 s: graba solo las 3 repeticiones.':e.message==='subida'?'No se pudo subir. Revisa la conexión y vuelve a intentarlo.':'No se pudo leer el video. Prueba grabarlo de nuevo con la cámara del teléfono.';
    UI.fmsErr={...(UI.fmsErr||{}),[k]:msg};render();
  }
}

const RULES_PREP=`Eres el entrenador de la persona en Sakros Go Prep. Escribe en español latinoamericano neutro, con tuteo y sin voseo. Quien te escribe es el entrenador, kinesiólogo y osteópata, o la propia persona desde la vista de cliente.
Sakros Go Prep: 10 minutos antes de cualquier entrenamiento (gimnasio, rutina propia o deporte), según la zona del día (piernas, tren superior, cuerpo completo, carrera o deporte): 3 min de rodillo de la zona, 2 correctivos y 3 min de activación con braceo y el patrón que se va a cargar. Nace de la experiencia del centro de entrenamiento de Sakros (2015–2020): con 10 minutos de preparación por zona, el FMS promedio pasó de 9 a 14 puntos en 6 meses. Es la experiencia del centro, no un estudio controlado: no prometas resultados ni prevención de lesiones.
Correctivos: salen del FMS por video. Orden de prioridad: primero las pruebas con dolor (no se corrigen con ejercicio: derivar al kinesiólogo), después las asimetrías y los puntajes de 1, en el orden elevación de pierna extendida, movilidad de hombro, estabilidad en rotación, flexión de estabilidad de tronco, estocada en línea, paso de valla y sentadilla profunda. Cada correctivo tiene 4 pasos y avanza con técnica limpia en 2 sesiones seguidas. Con asimetría, se empieza por el lado débil y se hace una serie extra de ese lado.
Sobre su rutina del gimnasio: puedes orientar en técnica, dosis y descanso, y recomendar el programa de entrenamiento de Sakros Go si no tiene una rutina bien dirigida.
Seguridad: dolor que aumenta, dolor irradiado, hormigueo o pérdida de fuerza → parar y consultar con su kinesiólogo.
Cómo responder: breve y concreto. No uses la herramienta de ajustes: en Prep los correctivos los define el FMS.`;

function rm1Test(k){const v=String((S.tests||{})[k+'_0']||'').replace(',','.');let m=v.match(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+)/i);
  let kg,r;if(m){kg=parseFloat(m[1]);r=parseInt(m[2],10)}else if((m=v.match(/(\d+(?:\.\d+)?)/))){kg=parseFloat(m[1]);r=5}
  if(!(kg>=20)||!(r>=1&&r<=12))return null;return kg*(1+r/30)}
function cargaTest(id){const t=TEST_CARGA[id];if(!t||!BASE1[id])return 0;const rm=rm1Test(t[0]);return rm?BASE1[id]*rm/t[1]:0}
function fmtKg(v){const st=v<20?0.5:v<40?1:2.5;const r=Math.round(v/st)*st;return String(Math.round(r*10)/10).replace('.',',')}
function escalar(str,id){
  if(!/kg/.test(str)||/^[kgx]/.test(String(id)))return str;
  const base=BASE1[id];const ref=parseFloat(String((atl().cargas||{})[id]||'').replace(',','.'))||cargaTest(id);
  if(base&&ref>0){const f=ref/base;return str.replace(/(\d+(?:,\d+)?) kg/g,(m,n)=>fmtKg(parseFloat(n.replace(',','.'))*f)+' kg')}
  return UI.atleta==='yo'?str:str.replace(/(\d+(?:,\d+)?) kg/g,'carga según RPE');
}

function tmin(it,s){
  if(it.tm!=null)return it.tm;
  if(String(it.id).startsWith('g'))return tminG(it,s);
  const id=it.id,base=id.replace(/[AB]$/,'');let m=TM[base];if(m==null)m=TM[id];
  const p=String(PP(it)[s-1]||'');
  if(id==='intervalos'){const x=p.match(/(\d+)×(\d+) min/);return x?(+x[1])*(+x[2])+(+x[1]-1)*2+1:15}
  if(id==='t3030'){const x=p.match(/(\d+)×(\d+)/);return x?(+x[1])*(+x[2])+(+x[1]-1)*2+1:8}
  if(id==='zona2'){const x=p.match(/(\d+) min/);return x?+x[1]+1:20}
  if(m==null)return 0;
  if(base==='pilar'||base==='act'){const v=p.match(/(\d) (vuelta|serie)/);if(v&&+v[1]>1)m+=base==='pilar'?2:1}
  if((s===4)&&['cargada','sentadilla','frontal','muerto','pushpress','cajon'].includes(base))m=Math.round(m*0.8);

  if(!W.some(w=>w.carga||w.pct))return null;

  if(ult&&prev){const r=ult.carga/prev.carga;nota=r>1.5?'Ojo: esta semana subiste más de 50 % la carga respecto a la anterior. Prioriza dormir bien y no sumes extra.':r<0.6&&!(ult.s===4||ult.s===8)?'Esta semana la carga bajó bastante. Si no fue una semana de descarga, revisa qué pasó.':'Carga estable respecto a la semana anterior.'}
  return h('section',{class:'card'},h('h2',{text:'Carga y cumplimiento'}),bars,
    h('p',{class:'note',text:'Barra: carga de la semana. Abajo: % de ejercicios hechos del plan. Semanas 4 y 8: descarga.'}),
    h('p',{class:'dxline',text:nota}),

}

 hombro:{n:'Pinzamiento subacromial de hombro',corto:'Hombro',lado:true,

 rodilla:{n:'Dolor anterior de rodilla (patelofemoral o tendinopatía rotuliana)',corto:'Rodilla ant.',lado:true,

 lumbar:{n:'Lumbalgia mecánica',corto:'Lumbar',lado:false,

function balance(){

function conF(str,f){
  if(f>=1)return str;
  return str.replace(/(\d+(?:,\d+)?) kg/g,(m,n)=>fmtKg(parseFloat(n.replace(',','.'))*f)+' kg');
}
function autoEj(s,d,it){
  const ex=EX[it.id];
  const base={n:ex.n,img:ex.img,pasos:ex.pasos,clave:ex.clave,pres:pres(s,d,it),changed:false};
  const sal=S.salud||{};
  if(sal.auto===false||S.ajustes[key(s,d,it.id)])return base;
  const c=rulesFor(it.id).filter(r=>r.o);
  if(!c.length)return base;
  const subs=c.filter(x=>x.o.alt||x.o.p||x.o.n);
  const sub=subs.find(x=>x.lvl==='sustituir')||subs[0];
  const fs=c.map(x=>x.o.f).filter(Boolean);const f=fs.length?Math.min(...fs):1;
  let sufs=[...new Set(c.map(x=>x.o.suf).filter(Boolean))];
  const out={...base,changed:true};const partes=[];
  const esTest=/máximo de reps|Test [35]RM/.test(base.pres)&&(sub||f<1);
  const calc=esTest?escalar(it.p[3],it.id):base.pres;const finTest=esTest?' · sin test esta semana':'';
  if(sub){
    const al=sub.o.alt?ALT[sub.o.alt]:null;
    if(al){out.n=sub.o.n||al.n;out.img=al.img;out.pasos=al.pasos;out.clave=null;partes.push('sustituido');sufs=[]}
    else if(sub.o.n){out.n=sub.o.n;partes.push('sustituido')}
    if(sub.o.p&&!sub.o.keep){out.pres=sub.o.p;if(!al)partes.push('prescripción cambiada')}
    else{out.pres=conF(calc,f)+finTest;if(f<1)partes.push('carga −'+Math.round((1-f)*100)+' %')}
  }else{out.pres=conF(calc,f)+finTest;if(f<1)partes.push('carga −'+Math.round((1-f)*100)+' %')}
  if(sufs.length){out.pres+=' · '+sufs.join(' · ');partes.push('trabajo añadido')}
  if(out.pres===base.pres&&out.n===base.n)return base;
  const quien=[...new Set((sub&&sub.o.alt?c.filter(x=>x===sub||x.o.f):c).map(x=>x.dx))].join(' y ');
  const tt=partes.join(' y ');out.motivo=tt.charAt(0).toUpperCase()+tt.slice(1)+' por '+quien+'.';
  return out;
}

const RULES=`Eres el entrenador personal del atleta, con el método EXOS. Si sus datos dicen DEPORTE: vóley playa, adapta todo a su deporte (saltos de ataque y bloqueo, desplazamientos en arena, hombro del atacante): no pongas trineo ni salidas de sprint dentro de la sesión; esos trabajos van como complementario en la playa, fuera de la rutina del día. Escribe en español latinoamericano neutro, con tuteo y sin voseo. Quien te escribe es el entrenador, osteópata, que gestiona a varios atletas (su propio perfil es «Mi perfil»). Habla del atleta seleccionado y usa términos técnicos.

Cómo responder: breve y concreto, en frases cortas. Usa listas con guiones cuando ayuden. Basa tus consejos en el registro que te paso; si falta un dato, pregúntalo.
Cambios al plan: para cambiar lo que aparece en una sesión usa la herramienta ajustar_prescripcion, una vez por semana y ejercicio. Úsala cuando el atleta pida un cambio o acepte el que propones; si no queda claro, propónlo y pregunta primero. Escribe la prescripción con el mismo formato del plan (por ejemplo «4×3 · 112,5 kg»). Después de ajustar, di en una línea qué cambiaste.
Los ajustes que haces con la herramienta tienen prioridad sobre la adaptación automática; úsalos solo si el atleta quiere algo distinto a lo que ya muestra el plan.

Diagnósticos: si el atleta tiene diagnósticos activos (te los paso con las adaptaciones de cada ejercicio), respétalos en cada consejo y en cada ajuste de carga, y no propongas nada que contradiga esas adaptaciones.`;
const RULES_BASE=`Eres el entrenador de control motor de la persona, en el Entrenamiento Base de Sakros Go. Quien ya tiene buen control motor puede saltarse el Base solo si su FMS completo da 14 o más de 21 y ninguna prueba con dolor; si no, recomiéndale hacer el Base para integrar el control motor y no lesionarse al ejecutar los entrenamientos. Escribe en español latinoamericano neutro, con tuteo y sin voseo. Quien te escribe es el entrenador, osteópata, que gestiona a varias personas (su propio perfil es «Mi perfil»), o la propia persona desde la vista de cliente.
Programa: 8 semanas de control motor con las que empieza todo cliente antes de su entrenamiento. Cuatro fases de 2 semanas: aprender (apoyo estable, tempo 3-1-1, espejo), automatizar (menos ayudas, una pierna), desafiar (menos apoyo, ojos cerrados en equilibrio, perturbaciones, carga liviana) y transferir (más rápido, reactivo, doble tarea). Día A: tren inferior y equilibrio; día B: tronco, braceo y tren superior. Cada sesión suma un módulo de 5 minutos: aterrizar y frenar, suelo pélvico y espalda, o equilibrio y suelo. RPE 4–6.

Cada ejercicio tiene 3 niveles y sube por separado con técnica limpia en 2 sesiones seguidas. Se pasa de fase con técnica limpia en al menos el 80 % de los ejercicios de las 2 semanas anteriores; si no, se repite la fase.
Cómo corregir: ante una dificultad, primero la corrección de control (posición de referencia, tempo, feedback con espejo, video, palo o vaso, foco externo), después bajar el nivel, y solo al final cambiar el ejercicio. Una o dos claves por vez, en lenguaje simple.
Seguridad: dolor que aumenta, mareo, dolor en el pecho, dolor irradiado o escape de orina persistente → parar y consultar.
Cómo responder: breve y concreto. Basa tus consejos en el registro (técnica limpia, niveles, notas).
Cambios al plan: usa la herramienta ajustar_prescripcion, una vez por semana y ejercicio, cuando la persona lo pida o acepte tu propuesta. Después de ajustar, di en una línea qué cambiaste.`;

const RULES_CORE=`Eres el entrenador y fisioterapeuta del paciente en el Entrenamiento Core de Sakros Go. Escribe en español latinoamericano neutro, con tuteo y sin voseo. Quien te escribe es el entrenador, osteópata, que gestiona a varios pacientes (su propio perfil es «Mi perfil»). Habla del paciente seleccionado y usa términos técnicos.

    doc(id){return{
      async set(data){const{error}=await sb.from('go_docs').upsert({path,id,data,updated_at:new Date().toISOString()});if(error)throw{code:error.code||'error'}},
      async delete(){const{error}=await sb.from('go_docs').delete().match({path,id});if(error)throw{code:error.code||'error'}},
      onSnapshot(cb,err){return watch(path,id,rows=>{const r=rows[0];cb({exists:!!r,data:()=>r?r.data:undefined})},err)}}},
    onSnapshot(cb,err){return watch(path,null,rows=>cb({docs:rows.map(r=>({id:r.id,data:()=>r.data})),metadata:{fromCache:false}}),err)}}}};
}

/* Coach: llama a /api/go/claude y ejecuta aquí las herramientas del plan */
async function goApi(body,signal){
  const{data:{session}}=await SB.auth.getSession();
  let r;
  try{r=await fetch('/api/go/claude',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(session?session.access_token:'')},body:JSON.stringify(body),signal})}
  catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'error'}}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw{code:j.code||'error'};
  if(j.stop_reason==='refusal')throw{code:'refused'};
  return j;
}
const txtDe=c=>(c||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
async function goSample(turns,opts={}){
  const tools=(opts.tools||[]);
  const defs=tools.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));
  const msgs=turns.map(t=>({role:t.role,content:t.content}));
  const signal=opts.signal||new AbortController().signal;
  let text='';
  for(let k=0;k<6;k++){
    const r=await goApi({messages:msgs,tools:defs},signal);
    text=txtDe(r.content);if(text&&opts.onText)opts.onText({text});
    const uses=(r.content||[]).filter(b=>b.type==='tool_use');
    if(r.stop_reason!=='tool_use'||!uses.length)return{text};
    msgs.push({role:'assistant',content:r.content});
    const res=[];
    for(const u of uses){const t=tools.find(x=>x.name===u.name);let out,isErr=false;
      try{if(!t)throw new Error('herramienta desconocida');out=await t.execute(u.input||{},{signal})}catch(e){out=String(e&&e.message||e);isErr=true}
      res.push({type:'tool_result',tool_use_id:u.id,content:String(out),is_error:isErr})}
    msgs.push({role:'user',content:res});
  }
  return{text};
}
goSample.json=async(prompt)=>{
  const r=await goApi({json:true,messages:[{role:'user',content:prompt+'\n\nResponde solo con el JSON, sin texto antes ni después.'}]});
  const t=txtDe(r.content),i=t.indexOf('{'),j=t.lastIndexOf('}');
  if(i<0||j<i)throw{code:'error'};
  return JSON.parse(t.slice(i,j+1));
};
