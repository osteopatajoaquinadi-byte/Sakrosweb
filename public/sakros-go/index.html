<style>
/* Página de espera: solo informa que Sakros Go existe. Sin enlaces, botones ni descargas. */
:root{color-scheme:dark;--bg:#0B1116;--ink:#EEF2F5;--soft:#B3BFCA;--muted:#7F8D9A;--accent:#EE6446}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#16222C 0%,var(--bg) 60%);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;text-align:center;-webkit-user-select:none;user-select:none}
main{max-width:560px}
.marca{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:40px}
.marca img{height:52px;width:auto;filter:invert(1) brightness(2);pointer-events:none}
.marca span{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:46px;color:var(--accent);line-height:1}
.chip{display:inline-block;border:1px solid rgba(238,100,70,.45);color:var(--accent);border-radius:999px;padding:6px 16px;font-size:.82rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin-bottom:22px}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2.6rem,9vw,4.4rem);line-height:.95;margin-bottom:18px}
p{color:var(--soft);font-size:1.15rem;line-height:1.55}
.barra{width:180px;height:4px;border-radius:4px;background:#1E2B36;margin:34px auto 0;overflow:hidden}
.barra i{display:block;height:100%;width:40%;background:var(--accent);border-radius:4px;animation:av 2.4s ease-in-out infinite}
@keyframes av{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.barra i{animation:none;width:60%}}
small{display:block;margin-top:48px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body oncontextmenu="return false">
<main>
  <div class="marca"><img src="/images/logo-sakros.png" alt="Sakros" draggable="false"><span>Go</span></div>
  <span class="chip">En construcción</span>
  <h1>Sakros Go</h1>
  <p>El método de Sakros, en tu teléfono.<br>Pronto más información.</p>
  <div class="barra" aria-hidden="true"><i></i></div>
  <small>Sakros · Viña del Mar</small>
</main>
</body>
</html>
